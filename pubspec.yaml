name: islam_azan_desktop
description: Flutter Azan (Adhan) reminder app for Desktop, Android and iOS. Accurate prayer times with local notifications.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  adhan_dart: ^2.0.1
  timezone: ^0.9.4
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
